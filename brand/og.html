<!doctype html><html><head><style>
html,body{margin:0}
.c{width:1200px;height:630px;background:#0e1019;color:#eef0fb;font-family:'DM Sans';position:relative;overflow:hidden;display:flex;padding:72px 80px;box-sizing:border-box;gap:56px;align-items:center}
.c:before{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 18% 30%,rgba(200,255,0,.08),transparent 70%)}
.l{flex:1;position:relative}
.logo{display:flex;align-items:baseline}
.xp{font-family:Outfit;font-weight:900;font-size:150px;letter-spacing:-10px;line-height:.9}
.x{position:relative;display:inline-block}.x:after{content:"";position:absolute;left:6px;right:-6px;bottom:10px;height:11px;border-radius:6px;background:#c8ff00}
.p{color:#c8ff00}
.dl{font-family:Outfit;font-size:46px;color:#9ca2c0;margin-left:4px}.dl b{color:#c8ff00}
.dot{width:16px;height:16px;border-radius:50%;background:#ff4d6d;margin-left:12px;transform:translateY(-62px)}
h1{font-family:Outfit;font-weight:800;font-size:54px;line-height:1.05;margin:36px 0 0;letter-spacing:-1px}
.sub{font-family:'Space Mono';font-size:18px;letter-spacing:4px;color:#9ca2c0;margin-top:22px;text-transform:uppercase}
.card{width:400px;background:#161a28;border:2px solid rgba(200,255,0,.35);border-radius:28px;padding:30px;position:relative;box-sizing:border-box}
.k{font-family:'Space Mono';font-weight:700;font-size:15px;color:#c8ff00;letter-spacing:2px}
.q{font-family:Outfit;font-weight:700;font-size:32px;line-height:1.12;margin:14px 0 22px}
.bar{display:flex;gap:4px;height:14px;border-radius:7px;overflow:hidden}.bar i{display:block}
.m{display:flex;justify-content:space-between;font-family:'Space Mono';font-size:15px;margin-top:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.btns div{border-radius:16px;padding:16px 18px;font-family:Outfit;font-weight:800;font-size:26px}
.btns small{display:block;font-family:'Space Mono';font-weight:400;font-size:13px}
.live{display:inline-flex;align-items:center;gap:8px;background:#ff4d6d;color:#fff;font-weight:700;font-size:14px;letter-spacing:1.5px;padding:5px 10px;border-radius:7px;margin-bottom:16px}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
</style></head><body><div class="c">
<div class="l"><div class="logo"><div class="xp"><span class="x">x</span><span class="p">p</span></div><div class="dl"><b>.</b>live</div><div class="dot"></div></div>
<h1>Watch live.<br>Call what happens next.</h1><div class="sub">Stream · Chat · Predict</div></div>
<div class="card"><div class="live">LIVE</div><div class="k">PREDICT NOW · 01:42</div><div class="q">Will the red marble win heat 3?</div>
<div class="bar"><i style="width:62%;background:#34edc5"></i><i style="width:38%;background:#a78bfa"></i></div>
<div class="m"><span style="color:#34edc5">YES 62%</span><span style="color:#a78bfa">38% NO</span></div>
<div class="btns"><div style="background:#34edc5;color:#04201a">Yes<small>pays 1.55×</small></div><div style="background:#a78bfa;color:#160b33">No<small>pays 2.53×</small></div></div></div>
</div></body></html>
