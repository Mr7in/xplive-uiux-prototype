<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xp.live · Watch live. Call what happens next.</title>
    <meta name="description" content="Live streams, community chat and YES/NO predictions on what happens next. Slots, esports, IRL challenges, marble racing and more." />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      // Apply the saved theme before first paint to avoid a flash (see src/lib/theme.tsx).
      (function () {
        var m = "dark";
        try { m = localStorage.getItem("xplive.theme") || "dark"; } catch (e) {}
        var dark = m === "dark" || (m === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (Open Graph / Twitter). Per-page values are updated at runtime by usePageMeta;
         for crawlers, render these server-side per route (see HANDOFF.md). -->
    <meta property="og:site_name" content="xp.live" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="xp.live · Watch live. Call what happens next." />
    <meta property="og:description" content="Live streams, community chat and YES/NO predictions on what happens next." />
    <meta property="og:image" content="https://xp.live/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="xp.live · Watch live. Call what happens next." />
    <meta name="twitter:description" content="Live streams, community chat and YES/NO predictions on what happens next." />
    <meta name="twitter:image" content="https://xp.live/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
